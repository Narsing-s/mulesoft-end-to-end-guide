name: Package and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          PACKAGE_DIR="release/${VERSION}"
          mkdir -p "$PACKAGE_DIR"

          rsync -a ./ "$PACKAGE_DIR/mulesoft-end-to-end-guide/" \
            --exclude='.git/' \
            --exclude='release/' \
            --exclude='_site/' \
            --exclude='node_modules/'

          cat > "$PACKAGE_DIR/RELEASE-MANIFEST.md" <<EOF
          # MuleJourney ${VERSION}

          This package contains the self-contained MuleSoft learning repository.

          - Repository: Narsing-s/mulesoft-end-to-end-guide
          - Source commit: ${GITHUB_SHA}
          - Package generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## Included

          - Complete MuleSoft learning repository
          - Internal learning portal
          - Deep theory and explanations
          - Diagrams and examples
          - DataWeave practice
          - Connector and Studio material
          - Labs and troubleshooting
          - Interview questions and answers
          - Production engineering guides
          - Login/email setup documentation

          ## Learning model

          The repository is self-contained. Required concepts are taught inside the repository rather than through a separate external documentation hub.

          ## Important

          MuleJourney is an independent educational project and is not an official MuleSoft product.
          EOF

          cd release
          zip -qr "mulejourney-${VERSION}.zip" "$VERSION"
          sha256sum "mulejourney-${VERSION}.zip" > "mulejourney-${VERSION}.sha256"

      - name: Validate package outputs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          test -s "release/mulejourney-${VERSION}.zip"
          test -s "release/mulejourney-${VERSION}.sha256"
          test -s "release/${VERSION}/RELEASE-MANIFEST.md"
          unzip -t "release/mulejourney-${VERSION}.zip" >/dev/null
          cd release
          sha256sum -c "mulejourney-${VERSION}.sha256"

      - name: Upload release package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mulejourney-${{ github.run_number }}-release-package
          path: |
            release/mulejourney-v0.1.${{ github.run_number }}.zip
            release/mulejourney-v0.1.${{ github.run_number }}.sha256
            release/v0.1.${{ github.run_number }}/RELEASE-MANIFEST.md
          retention-days: 30

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          mkdir -p release/notes
          cat > release/notes/RELEASE-NOTES.md <<EOF
          # MuleJourney ${VERSION}

          ## What's included

          - Current self-contained learning portal
          - Mule Runtime, DataWeave, API, connector, security, testing, deployment and operations theory
          - Hands-on labs and interview preparation
          - Production troubleshooting and architecture material
          - Current login, account deletion and email setup documentation

          ## Source

          Commit: ${GITHUB_SHA}

          ## Verification

          The package is validated with unzip -t and SHA-256 verification before publication.
          EOF

      - name: Publish GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" \
            "release/mulejourney-${VERSION}.zip" \
            "release/mulejourney-${VERSION}.sha256" \
            "release/notes/RELEASE-NOTES.md" \
            "release/${VERSION}/RELEASE-MANIFEST.md" \
            --target "${GITHUB_SHA}" \
            --title "MuleJourney ${VERSION}" \
            --notes-file "release/notes/RELEASE-NOTES.md"
