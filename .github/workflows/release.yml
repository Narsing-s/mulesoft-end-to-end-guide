name: Package and publish release

on:
  workflow_run:
    workflows: ["Deploy learning site"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the successful Pages commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Build release package
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          PACKAGE_DIR="release/${VERSION}"
          mkdir -p "$PACKAGE_DIR"

          rsync -a ./ "$PACKAGE_DIR/mulesoft-end-to-end-guide/" \
            --exclude='.git/' \
            --exclude='release/' \
            --exclude='_site/' \
            --exclude='node_modules/'

          cat > "$PACKAGE_DIR/RELEASE-MANIFEST.md" <<EOF
          # MuleJourney ${VERSION}

          This package was generated automatically after a successful GitHub Pages deployment.

          - Repository: Narsing-s/mulesoft-end-to-end-guide
          - Source commit: ${SOURCE_SHA}
          - Pages workflow: Deploy learning site
          - Successful Pages run: ${PAGES_RUN_ID}
          - Release workflow run: ${GITHUB_RUN_ID}
          - Package generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## Included

          - Complete MuleSoft learning repository
          - docs/ learning portal
          - Deep explanations, labs, interview material and production guides
          - Official documentation mapping
          - Login/email setup documentation
          - Release documentation

          ## Integrity

          The ZIP has a matching SHA-256 checksum asset in the GitHub Release.

          ## Important

          MuleJourney is an independent educational project and is not an official MuleSoft product.
          EOF

          cd release
          zip -qr "mulejourney-${VERSION}.zip" "$VERSION"
          sha256sum "mulejourney-${VERSION}.zip" > "mulejourney-${VERSION}.sha256"

      - name: Validate package outputs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          test -s "release/mulejourney-${VERSION}.zip"
          test -s "release/mulejourney-${VERSION}.sha256"
          test -s "release/${VERSION}/RELEASE-MANIFEST.md"
          unzip -t "release/mulejourney-${VERSION}.zip" >/dev/null
          cd release
          sha256sum -c "mulejourney-${VERSION}.sha256"

      - name: Upload release package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mulejourney-${{ github.run_number }}-release-package
          path: |
            release/mulejourney-v0.1.${{ github.run_number }}.zip
            release/mulejourney-v0.1.${{ github.run_number }}.sha256
            release/v0.1.${{ github.run_number }}/RELEASE-MANIFEST.md
          retention-days: 30

      - name: Generate release notes
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          mkdir -p release/notes
          cat > release/notes/RELEASE-NOTES.md <<EOF
          # MuleJourney ${VERSION}

          ## Release status

          Published automatically because the Deploy learning site workflow completed successfully.

          ## What's included

          - Current repository documentation and learning portal
          - Mule Runtime, DataWeave, API, connector, security, testing, deployment and operations material
          - Hands-on labs and interview preparation
          - Official MuleSoft documentation references
          - Current login, account deletion and email setup documentation
          - Releases and Packages center

          ## Source

          Commit: ${SOURCE_SHA}

          Successful Pages workflow run: ${PAGES_RUN_ID}

          ## Verification

          The package is validated with unzip -t and SHA-256 verification before the GitHub Release is created. The workflow artifact is also retained for 30 days.
          EOF

      - name: Publish GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" \
            "release/mulejourney-${VERSION}.zip" \
            "release/mulejourney-${VERSION}.sha256" \
            "release/notes/RELEASE-NOTES.md" \
            "release/${VERSION}/RELEASE-MANIFEST.md" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "MuleJourney ${VERSION}" \
            --notes-file "release/notes/RELEASE-NOTES.md"
